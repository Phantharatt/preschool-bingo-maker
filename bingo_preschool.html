html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101b23;--panel:#1a2a35;--text:#e8f0f5;--line:#375062}}
:root[data-theme="dark"]{--bg:#101b23;--panel:#1a2a35;--text:#e8f0f5;--line:#375062}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Kanit',system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:16px;grid-template-columns:1fr}
.panel.has-list{grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);align-items:start}
.control-main{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr));align-items:end}
.full{grid-column:1/-1}
label{display:grid;gap:4px;font-size:14px}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);width:100%}
.panel input[type=text],.panel input[type=number]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);width:100%}
textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);width:100%;min-height:130px;resize:vertical}
.custom-panel{display:grid;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:12px;background:rgba(47,158,99,.07);min-width:0}
@media (min-width:761px){
 .panel.has-list .custom-panel{height:100%;align-self:stretch;min-height:0;display:flex;flex-direction:column}
 .panel.has-list .custom-panel>label{min-height:0;flex:1 1 auto;display:flex;flex-direction:column}
 .panel.has-list #listData{flex:1 1 auto;width:100%;height:auto;min-height:0;resize:vertical}
}
.custom-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#drawResult{font-weight:600;min-height:1.4em}
.custom-note{font-size:13px;opacity:.75}
.math-only.hidden,.custom-panel.hidden{display:none}
.chk{display:flex;align-items:center;gap:8px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--accent);color:#fff}
button.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid #f6a53a;outline-offset:1px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
#msg{min-height:1.3em;font-size:14px;color:#d9822b}
.sheets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start;margin-top:18px}
.sheet-box{display:grid;gap:8px;justify-items:center;width:100%;min-width:0}
.sheet{position:relative;width:100%;aspect-ratio:765/1024;background:var(--img) center/100% 100% no-repeat;container-type:inline-size;border-radius:14px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.ttl{position:absolute;left:25.5%;width:49.7%;top:15%;height:6.4%;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;color:#fff;font-weight:600;line-height:1.3;text-shadow:0 .4cqw 0 rgba(0,30,20,.4)}
.grid{position:absolute;left:7.97%;top:33.4%;width:84.3%;height:58.2%;display:grid;gap:2cqw;--fs:9cqw}
.grid.n4{--fs:12cqw;gap:2.3cqw}.grid.n3{--fs:16.5cqw;gap:2.8cqw}
.tile{position:relative;border-radius:2.4cqw;border:.7cqw solid #e2b24f;
 background:radial-gradient(120% 120% at 25% 18%,#52b892 0%,#31926b 38%,#1f6b4d 100%);
 box-shadow:0 0 0 .3cqw #8b5d1e,inset 0 0 0 .35cqw #1a5a3f,inset 0 .8cqw 1.4cqw rgba(255,255,255,.22),inset 0 -1cqw 1.5cqw rgba(0,30,20,.38)}
.tile::before{content:"";position:absolute;left:8%;top:6%;width:52%;height:20%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0));pointer-events:none}
.n3 .tile{border-radius:3.2cqw}
.cell{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;text-align:center;padding:0;min-width:0;caret-color:#fff;border-radius:inherit;
 font:600 var(--fs) 'Fredoka','Kanit',sans-serif;transform:translateY(-0.6cqw);-webkit-text-stroke:.07em rgba(12,50,35,.6);paint-order:stroke fill;text-shadow:0 .07em 0 rgba(8,40,25,.6)}
.cell.long{font-size:calc(var(--fs)*.78)}
.cell:focus{background:rgba(255,255,255,.12)}
.tile.dup{box-shadow:0 0 0 .8cqw #ff4d4d,inset 0 0 0 .35cqw #1a5a3f}
@media (max-width:980px){
 .panel.has-list{grid-template-columns:minmax(0,1fr) minmax(260px,.75fr)}
 .control-main{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
 .panel,.panel.has-list{grid-template-columns:1fr}
 .control-main{grid-template-columns:1fr 1fr}
}
@media (max-width:600px){
 .sheets{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
}
@media (max-width:430px){
 .wrap{padding:10px}
 .control-main{grid-template-columns:1fr}
 .sheets{grid-template-columns:1fr}
}
@media print{
 *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
 @page{size:A4;margin:6mm}
 body{background:#fff}.panel,.tools,#msg,.hint{display:none}
 .wrap{padding:0;max-width:none}
 .sheets{display:block;margin:0}
 .sheet-box{page-break-after:always;padding-top:0;margin:0 auto;width:198mm;max-width:198mm;
  min-height:283mm;display:flex;flex-direction:column;align-items:center;justify-content:center}
 .sheet-box .sheet{flex:none}
 .sheet{box-shadow:none;border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;background-color:#bfe5f6}
 .wrap,.sheets,.sheet-box{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .tile{box-shadow:0 0 0 .3cqw #8b5d1e,inset 0 0 0 .35cqw #1a5a3f,inset 0 .8cqw 1.4cqw rgba(255,255,255,.22),inset 0 -1cqw 1.5cqw rgba(0,30,20,.38);-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .tile.dup{box-shadow:0 0 0 .3cqw #8b5d1e,inset 0 0 0 .35cqw #1a5a3f,inset 0 .8cqw 1.4cqw rgba(255,255,255,.22),inset 0 -1cqw 1.5cqw rgba(0,30,20,.38)}
 .cell,.ttl{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
 <div class="panel" id="controlPanel">
  <div class="control-main">
   <label class="full">หัวข้อบิงโก
    <input type="text" id="title" value="คณิตศาสตร์" maxlength="40"></label>
   <label class="full">ประเภทข้อมูล
    <select id="topic">
     <option value="math" selected>คณิตศาสตร์</option>
     <option value="thai">ภาษาไทย</option>
     <option value="enLower">ภาษาอังกฤษ (ตัวเล็ก)</option>
     <option value="enUpper">ภาษาอังกฤษ (ตัวใหญ่)</option>
     <option value="custom">Custom</option>
    </select>
   </label>
   <label>ขนาดตาราง <select id="size"><option value="5">5×5 (25 ช่อง)</option><option value="4">4×4 (16 ช่อง)</option><option value="3">3×3 (9 ช่อง)</option></select></label>
   <label class="math-only">เลขน้อยสุด <input type="number" id="min" value="0"></label>
   <label class="math-only">เลขมากสุด <input type="number" id="max" value="29"></label>
   <label>จำนวนแผ่น <input type="number" id="count" value="1" min="1" max="30"></label>
   <label class="chk full"><input type="checkbox" id="dup"> ให้ข้อมูลซ้ำกันได้ในแผ่นเดียวกัน</label>
   <div class="btns full">
    <button id="gen">สุ่มทั้งหมด</button>
    <button class="alt" id="clear">ล้างข้อมูล (พิมพ์เองทุกช่อง)</button>
    <button class="alt" id="print">พิมพ์</button>
    <button class="alt" id="dlAll">ดาวน์โหลดเป็นรูปภาพ (ทุกแผ่น)</button>
   </div>
   <div id="msg" class="full" role="status"></div>
  </div>
  <div id="listPanel" class="custom-panel hidden">
   <label><span id="listLabel">รายการข้อมูล</span> <span id="listCount" class="custom-note"></span>
    <textarea id="listData" placeholder="ใส่ข้อมูลทีละบรรทัด"></textarea>
   </label>
   <div class="custom-note">สามารถเพิ่ม ลบ หรือแก้ไขรายการได้ แล้วกด “สุ่มทั้งหมด” เพื่อสุ่มรายการลงใน Bingo ทุกช่อง</div>
  </div>
 </div>
 <p class="hint" style="font-size:14px;opacity:.8;margin:10px 4px 0">แตะที่ช่องใดก็ได้เพื่อแก้ข้อมูล ช่องที่ขอบแดงคือข้อมูลซ้ำในแผ่นเดียวกัน</p>
 <div class="sheets" id="sheets"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const COLORS=['#ffe04a','#a3d94f','#f7a93b','#ef6b5f','#a880d6','#54b4e6','#ee7db4'];
const COLS=[[65,179],[196,309],[328,440],[458,571],[589,702]];
const ROWS=[[346,451],[466,572],[587,693],[708,814],[828,934]];
let N=5;
const SAMPLE=[0,14,29,3,18,25,1,12,21,4,15,28,6,19,8,9,22,11,23,5,26,13,2,24,16];
const SAMPLE_C=[0,1,2,3,4,3,3,5,2,4,6,3,6,1,0,3,5,1,3,1,3,2,2,4,4];
const DEFMAX={5:29,4:19,3:12};
const THAI=['ก','ข','ฃ','ค','ฅ','ฆ','ง','จ','ฉ','ช','ซ','ฌ','ญ','ฎ','ฏ','ฐ','ฑ','ฒ','ณ','ด','ต','ถ','ท','ธ','น','บ','ป','ผ','ฝ','พ','ฟ','ภ','ม','ย','ร','ล','ว','ศ','ษ','ส','ห','ฬ','อ','ฮ'];
const EN_LOWER=Array.from({length:26},(_,i)=>String.fromCharCode(97+i));
const EN_UPPER=EN_LOWER.map(v=>v.toUpperCase());
const TOPIC_DEFAULTS={
 thai:THAI.join('\n'),
 enLower:EN_LOWER.join('\n'),
 enUpper:EN_UPPER.join('\n'),
 custom:''
};
const TOPIC_LABELS={
 thai:'รายการภาษาไทย',
 enLower:'รายการภาษาอังกฤษ (ตัวเล็ก)',
 enUpper:'รายการภาษาอังกฤษ (ตัวใหญ่)',
 custom:'รายการ Custom'
};
const TOPIC_TITLES={
 math:'คณิตศาสตร์',
 thai:'ภาษาไทย',
 enLower:'ภาษาอังกฤษ (ตัวเล็ก)',
 enUpper:'ภาษาอังกฤษ (ตัวใหญ่)',
 custom:''
};
const $=id=>document.getElementById(id);
let cards=[SAMPLE.map((v,i)=>({v:String(v),c:SAMPLE_C[i]}))];


function range(){let a=parseInt($('min').value),b=parseInt($('max').value);
 if(isNaN(a))a=0;if(isNaN(b))b=DEFMAX[N];if(a>b)[a,b]=[b,a];return[a,b]}

function listTopic(){
 const topic=$('topic').value;
 return ['thai','enLower','enUpper','custom'].includes(topic);
}

function listItems(){
 return $('listData').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
}

function updateListCount(){
 const topic=$('topic').value;
 const countEl=$('listCount');
 if(!countEl) return;
 if(!listTopic()){ countEl.textContent=''; return; }
 const n=listItems().length;
 countEl.textContent='('+(n)+' ตัวสุ่ม)';
}

function topicItems(){
 const topic=$('topic').value;
 if(topic==='math'){
  const[lo,hi]=range();
  return Array.from({length:hi-lo+1},(_,i)=>String(lo+i));
 }
 return listItems();
}

function loadTopicList(topic){
 if(topic==='math')return;
 const textarea=$('listData');
 const current=textarea.dataset.topic;
 if(current!==topic){
  textarea.value=TOPIC_DEFAULTS[topic]??'';
  textarea.dataset.topic=topic;
 }
 $('listLabel').textContent=TOPIC_LABELS[topic]||'รายการข้อมูล';
 updateListCount();
}

function shuffleValues(source,T,dup){
 let pool=source.slice(),vals=[];
 if(!pool.length)return vals;
 if(!dup&&pool.length<T){
  dup=true;
  $('msg').textContent='มีข้อมูล '+pool.length+' รายการ ไม่พอสำหรับ '+T+' ช่องแบบไม่ซ้ำ จึงอนุญาตให้ซ้ำแทน';
 }
 if(dup){
  for(let i=0;i<T;i++)vals.push(pool[Math.floor(Math.random()*pool.length)]);
 }else{
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  vals=pool.slice(0,T);
 }
 return vals;
}

function makeCard(){
 const T=N*N,dup=$('dup').checked,topic=$('topic').value;
 const source=topicItems();
 if(!source.length){
  $('msg').textContent=topic==='custom'?'กรุณาใส่ข้อมูล Custom อย่างน้อย 1 รายการ':'กรุณาใส่ข้อมูลอย่างน้อย 1 รายการ';
  return Array.from({length:T},()=>({v:'',c:Math.floor(Math.random()*COLORS.length)}));
 }
 const vals=shuffleValues(source,T,dup);
 return vals.map(v=>({v:String(v),c:Math.floor(Math.random()*COLORS.length)}));
}

function count(){return Math.max(1,Math.min(30,parseInt($('count').value)||1))}

function updateTopicUI(){
 const topic=$('topic').value,showList=listTopic();
 $('listPanel').classList.toggle('hidden',!showList);
 $('controlPanel').classList.toggle('has-list',showList);
 document.querySelectorAll('.math-only').forEach(el=>el.classList.toggle('hidden',topic!=='math'));
 if(showList)loadTopicList(topic);
}

function gen(){
 $('msg').textContent='';
 const topic=$('topic').value;
 if(topic!=='math' && !listItems().length){
  $('msg').textContent=topic==='custom'?'กรุณาใส่ข้อมูล Custom อย่างน้อย 1 รายการ':'กรุณาใส่ข้อมูลในรายการอย่างน้อย 1 รายการ';
 }
 cards=Array.from({length:count()},makeCard);
 render();
}

function clearAll(){
 $('msg').textContent='';
 cards=Array.from({length:count()},()=>Array.from({length:N*N},()=>({v:'',c:Math.floor(Math.random()*COLORS.length)})));
 render();
}

function markDups(ci){
 const els=document.querySelectorAll('[data-card="'+ci+'"] .tile');const seen={};
 cards[ci].forEach(c=>{const k=c.v.trim();if(k)seen[k]=(seen[k]||0)+1});
 els.forEach((el,i)=>{const k=cards[ci][i].v.trim();el.classList.toggle('dup',!!k&&seen[k]>1)});
}
function render(){
 const box=$('sheets');box.innerHTML='';
 cards.forEach((card,ci)=>{
  const wrap=document.createElement('div');wrap.className='sheet-box';wrap.dataset.card=ci;
  wrap.innerHTML='<div class="sheet"><div class="ttl"></div><div class="grid n'+N+'"></div></div><div class="tools"><button class="alt">สุ่มแผ่นนี้ใหม่</button><button class="alt dl1">ดาวน์โหลดภาพนี้</button></div>';
  const grid=wrap.querySelector('.grid');
  grid.style.gridTemplateColumns='repeat('+N+',1fr)';grid.style.gridTemplateRows='repeat('+N+',1fr)';
  card.forEach((c,i)=>{
   const tile=document.createElement('div');tile.className='tile';
   const inp=document.createElement('input');inp.type='text';inp.className='cell';inp.maxLength=3;
   inp.value=c.v;inp.style.color=COLORS[c.c];inp.setAttribute('aria-label','ช่อง '+(i+1));
   const sz=()=>inp.classList.toggle('long',inp.value.length>2);sz();
   inp.addEventListener('input',()=>{c.v=inp.value;sz();markDups(ci)});
   tile.appendChild(inp);grid.appendChild(tile)});
  wrap.querySelector('.tools button').onclick=()=>{$('msg').textContent='';cards[ci]=makeCard();render()};
  wrap.querySelector('.dl1').onclick=()=>downloadSheet(ci);
  box.appendChild(wrap);
 });
 setTitle();cards.forEach((_,ci)=>markDups(ci));
}
function fitTitle(){document.querySelectorAll('.ttl').forEach(e=>{
 let s=8.5;
 e.style.fontSize=s+'cqw';
 while(e.scrollWidth>e.clientWidth&&s>1){s-=0.1;e.style.fontSize=s.toFixed(1)+'cqw'}
 })}
function setTitle(){document.querySelectorAll('.ttl').forEach(e=>e.textContent=$('title').value);fitTitle()}
function syncTitleToTopic(){
 const topic=$('topic').value;
 $('title').value=TOPIC_TITLES[topic]??'';
 setTitle();
}
$('title').addEventListener('input',setTitle);
$('topic').addEventListener('change',()=>{syncTitleToTopic();updateTopicUI();gen()});
$('listData').addEventListener('input',()=>{
 if(listTopic()){TOPIC_DEFAULTS[$('topic').value]=$('listData').value;updateListCount();}
});
$('size').addEventListener('change',()=>{N=+$('size').value;$('min').value=0;$('max').value=DEFMAX[N];gen()});
$('gen').onclick=gen;$('clear').onclick=clearAll;$('print').onclick=()=>window.print();
window.addEventListener('resize',fitTitle);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitTitle);
updateTopicUI();
syncTitleToTopic();
render();

/* ---------- ดาวน์โหลดเป็นรูปภาพ ---------- */
const GRIDBOX={x:.0797,y:.334,w:.843,h:.582};
const TITLEBOX={x:.255,y:.15,w:.497,h:.064};
const GAPF={5:.02,4:.023,3:.028};
const RADF={5:.024,4:.024,3:.032};
const FSF={5:.096,4:.126,3:.172};
const BORDERF=.007,OUTERF=.003,INNERF=.0035;
let bgImg=null;
function bgUrl(){const v=getComputedStyle(document.documentElement).getPropertyValue('--img').trim();
 const m=v.match(/^url\(["']?(.*?)["']?\)$/);return m?m[1]:v}
function loadBg(){if(bgImg)return Promise.resolve(bgImg);
 return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{bgImg=im;res(im)};im.onerror=rej;im.src=bgUrl()})}
function roundRectPath(ctx,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));
 ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
 ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawTile(ctx,x,y,w,h,r){
 const ow=OUTERF*gwCache,bw=BORDERF*gwCache,iw=INNERF*gwCache;
 roundRectPath(ctx,x-ow,y-ow,w+2*ow,h+2*ow,r+ow);ctx.fillStyle='#8b5d1e';ctx.fill();
 roundRectPath(ctx,x,y,w,h,r);
 const g=ctx.createRadialGradient(x+.25*w,y+.18*h,2,x+.25*w,y+.18*h,1.15*Math.max(w,h));
 g.addColorStop(0,'#52b892');g.addColorStop(.38,'#31926b');g.addColorStop(1,'#1f6b4d');
 ctx.fillStyle=g;ctx.fill();
 ctx.lineWidth=bw*2;ctx.strokeStyle='#e2b24f';ctx.stroke();
 roundRectPath(ctx,x+bw*1.3,y+bw*1.3,w-bw*2.6,h-bw*2.6,r*.85);ctx.lineWidth=iw*2;ctx.strokeStyle='#1a5a3f';ctx.stroke();
 ctx.save();roundRectPath(ctx,x,y,w,h,r);ctx.clip();
 const hi=ctx.createLinearGradient(0,y,0,y+h*.32);
 hi.addColorStop(0,'rgba(255,255,255,.32)');hi.addColorStop(1,'rgba(255,255,255,0)');
 ctx.fillStyle=hi;ctx.fillRect(x,y,w,h*.32);ctx.restore();
}
let gwCache=0;
function drawNumber(ctx,text,cx,cy,fontPx,color){
 ctx.font='600 '+fontPx+'px Fredoka, Kanit, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
 const so=fontPx*.07;
 ctx.fillStyle='rgba(8,40,25,.6)';ctx.fillText(text,cx,cy+so);
 ctx.lineWidth=fontPx*.14;ctx.strokeStyle='rgba(12,50,35,.6)';ctx.strokeText(text,cx,cy);
 ctx.fillStyle=color;ctx.fillText(text,cx,cy);
}
async function renderCardCanvas(card,title,n){
 const img=await loadBg();
 const CW=img.naturalWidth,CH=img.naturalHeight;
 const canvas=document.createElement('canvas');canvas.width=CW;canvas.height=CH;
 const ctx=canvas.getContext('2d');
 ctx.drawImage(img,0,0,CW,CH);
 if(document.fonts&&document.fonts.load){try{await document.fonts.load('600 100px Fredoka')}catch(e){}}
 // title
 const tx=TITLEBOX.x*CW,ty=TITLEBOX.y*CH,tw=TITLEBOX.w*CW,th=TITLEBOX.h*CH;
 let fs=CW*.085;const step=CW*.001;ctx.font='600 '+fs+'px Fredoka, Kanit, sans-serif';
 while(ctx.measureText(title).width>tw&&fs>CW*.01){fs-=step;ctx.font='600 '+fs+'px Fredoka, Kanit, sans-serif'}
 const tcx=tx+tw/2,tcy=ty+th/2,tso=CH*.006;
 ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillStyle='rgba(0,30,20,.4)';ctx.fillText(title,tcx,tcy+tso);
 ctx.fillStyle='#fff';ctx.fillText(title,tcx,tcy);
 // grid
 const gx=GRIDBOX.x*CW,gy=GRIDBOX.y*CH,gw=GRIDBOX.w*CW,gh=GRIDBOX.h*CH;
 gwCache=gw;
 const gap=GAPF[n]*gw,r=RADF[n]*gw,fpx=FSF[n]*gw;
 const cw=(gw-gap*(n-1))/n,ch=(gh-gap*(n-1))/n;
 card.forEach((c,i)=>{
  const row=Math.floor(i/n),col=i%n;
  const x=gx+col*(cw+gap),y=gy+row*(ch+gap);
  drawTile(ctx,x,y,cw,ch,r);
  const fontPx=(c.v.trim().length>2)?fpx*.82:fpx;
  drawNumber(ctx,c.v||'',x+cw/2,y+ch/2-ch*.012,fontPx,COLORS[c.c]);
 });
 return canvas;
}
function triggerDownload(canvas,filename){
 canvas.toBlob(blob=>{
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
 },'image/png')
}
async function downloadSheet(ci){
 const btn=document.querySelector('[data-card="'+ci+'"] .dl1');
 if(btn){btn.disabled=true;btn.textContent='กำลังสร้างภาพ...'}
 const title=$('title').value||'บิงโก';
 const canvas=await renderCardCanvas(cards[ci],title,N);
 triggerDownload(canvas,'bingo-'+title+'-'+(ci+1)+'.png');
 if(btn){btn.disabled=false;btn.textContent='ดาวน์โหลดภาพนี้'}
}
function canvasToBlob(canvas){
 return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('ไม่สามารถสร้างไฟล์รูปภาพได้')),'image/png'));
}

function safeFileName(name){
 return (name||'bingo').replace(/[\\/:*?"<>|]/g,'_').trim()||'bingo';
}

async function downloadAll(){
 const btn=$('dlAll');btn.disabled=true;
 try{
  const title=safeFileName($('title').value||'บิงโก');
  if(cards.length===1){
   btn.textContent='กำลังสร้างภาพ...';
   const canvas=await renderCardCanvas(cards[0],$('title').value||'บิงโก',N);
   triggerDownload(canvas,'bingo-'+title+'-1.png');
  }else{
   if(typeof JSZip==='undefined') throw new Error('ไม่พบตัวสร้างไฟล์ ZIP กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่');
   const zip=new JSZip();
   for(let i=0;i<cards.length;i++){
    btn.textContent='กำลังสร้าง ZIP '+(i+1)+'/'+cards.length;
    const canvas=await renderCardCanvas(cards[i],$('title').value||'บิงโก',N);
    zip.file('bingo-'+title+'-'+(i+1)+'.png',await canvasToBlob(canvas));
   }
   btn.textContent='กำลังบีบอัดไฟล์ ZIP...';
   const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
   const url=URL.createObjectURL(blob);
   const a=document.createElement('a');a.href=url;a.download='bingo-'+title+'-'+cards.length+'-sheets.zip';
   document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),5000);
  }
 }catch(err){
  console.error(err);
  $('msg').textContent=err.message||'เกิดข้อผิดพลาดในการดาวน์โหลด';
 }finally{
  btn.disabled=false;
  btn.textContent=cards.length>1?'ดาวน์โหลดรูปภาพ (ทุกแผ่น • ZIP)':'ดาวน์โหลดเป็นรูปภาพ (ทุกแผ่น)';
 }
}
$('dlAll').textContent='ดาวน์โหลดเป็นรูปภาพ (ทุกแผ่น)';
$('dlAll').onclick=downloadAll;
</script>
</body>
</html>
